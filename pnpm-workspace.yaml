packages:
  - "apps/*"

# CI/Vercel: lockfile já versionado — evita prompt interativo de supply-chain
trustLockfile: true

allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/linux-arm64": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  esbuild: true
  prisma: true
